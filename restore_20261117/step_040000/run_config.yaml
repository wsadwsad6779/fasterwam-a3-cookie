output_dir: /workspace/_v1_stage/run40k
batch_size: 6
num_workers: 8
lr_scheduler_type: cosine
learning_rate: 0.0001
num_epochs: 10
max_steps: 40000
log_every: 20
save_every: 40000
eval_every: 0
eval_num_inference_steps: 10
gradient_accumulation_steps: 1
mixed_precision: bf16
seed: 42
max_grad_norm: 1.0
weight_decay: 0.01
resume: /workspace/_v1_stage/run40k/checkpoints/light/step_035000
wandb:
  enabled: false
  workspace: null
  project: fasterwam
  name: train
  group: null
  mode: online
data:
  train:
    _target_: fasterwam.datasets.lerobot.a3_video_dataset.A3VideoDataset
    dataset_dirs:
    - /workspace/a3_data/a3_fw_v1g
    shape_meta:
      images:
      - key: image
        raw_shape:
        - 3
        - 224
        - 224
        shape:
        - 3
        - 224
        - 224
      - key: wrist_image
        raw_shape:
        - 3
        - 224
        - 224
        shape:
        - 3
        - 224
        - 224
      action:
      - key: default
        raw_shape: 7
        shape: 7
      state:
      - key: default
        raw_shape: 14
        shape: 14
    num_frames: 33
    global_sample_stride: 1
    action_video_freq_ratio: 4
    video_size:
    - 224
    - 448
    camera_key: null
    val_set_proportion: 0.0
    is_training_set: true
    skip_padding_as_possible: false
    concat_multi_camera: horizontal
    processor:
      _target_: fasterwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
      shape_meta:
        images:
        - key: image
          raw_shape:
          - 3
          - 224
          - 224
          shape:
          - 3
          - 224
          - 224
        - key: wrist_image
          raw_shape:
          - 3
          - 224
          - 224
          shape:
          - 3
          - 224
          - 224
        action:
        - key: default
          raw_shape: 7
          shape: 7
        state:
        - key: default
          raw_shape: 14
          shape: 14
      num_obs_steps: 33
      num_output_cameras: 2
      action_output_dim: 7
      proprio_output_dim: 14
      delta_action_dim_mask:
        default:
        - true
        - true
        - true
        - true
        - true
        - true
        - false
      action_state_transforms: null
      use_stepwise_action_norm: false
      norm_default_mode: min/max
      norm_exception_mode: null
      action_state_merger:
        _target_: fasterwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
      train_transforms:
      - _target_: fasterwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size:
        - 224
        - 224
      val_transforms:
      - _target_: fasterwam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size:
        - 224
        - 224
    text_embedding_cache_dir: /workspace/a3_data/text_embeds_cache
    context_len: 128
    pretrained_norm_stats: /workspace/a3_data/a3_fw_v1g/dataset_stats.json
    force_arrays_path: /workspace/a3_data/a3_fw_force/arrays.npz
    force_channels:
    - 0
    - 1
    - 2
    - 12
    - 13
    - 16
    force_hist_len: 16
    force_horizon: 32
model:
  _target_: fasterwam.runtime.create_fasterwam
  model_id: Wan-AI/Wan2.2-TI2V-5B
  tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
  tokenizer_max_len: 128
  load_text_encoder: false
  proprio_dim: 14
  redirect_common_files: false
  mot_checkpoint_mixed_attn: false
  condition_layers:
  - 0
  - 4
  - 8
  - 12
  - 16
  - 20
  - 24
  - 28
  video_kv_fusion: interval_weighted_sum
  video_kv_fusion_init: current_layer
  action_dit_pretrained_path: checkpoints/SparseActionDiT_cond_0_4_8_12_16_20_24_28_Wan22_alphascale_1024hdim.pt
  skip_dit_load_from_pretrain: true
  video_dit_config:
    has_image_input: false
    patch_size:
    - 1
    - 2
    - 2
    in_dim: 48
    hidden_dim: 3072
    ffn_dim: 14336
    freq_dim: 256
    text_dim: 4096
    out_dim: 48
    num_heads: 24
    attn_head_dim: 128
    num_layers: 30
    eps: 1.0e-06
    seperated_timestep: true
    require_clip_embedding: false
    require_vae_embedding: false
    fuse_vae_embedding_in_latents: true
    use_gradient_checkpointing: false
    video_attention_mask_mode: first_frame_causal
    action_conditioned: false
    action_dim: 7
    action_group_causal_mask_mode: group_diagonal
  action_dit_config:
    action_dim: 7
    hidden_dim: 1024
    ffn_dim: 4096
    num_layers: 30
    num_heads: 24
    noncondition_num_heads: 8
    attn_head_dim: 128
    text_dim: 4096
    freq_dim: 256
    eps: 1.0e-06
    condition_layers:
    - 0
    - 4
    - 8
    - 12
    - 16
    - 20
    - 24
    - 28
    use_gradient_checkpointing: false
  video_scheduler:
    train_shift: 5.0
    infer_shift: 5.0
    num_train_timesteps: 1000
  action_scheduler:
    train_shift: 5.0
    infer_shift: 5.0
    num_train_timesteps: 1000
  loss:
    lambda_action: 1.0
  force:
    lambda_force: 1.0
    conditioner:
      enabled: true
      channels:
      - 0
      - 1
      - 2
      - 12
      - 13
      - 16
      channel_note: 'Left wrist 3-axis force (cols 0-2), left finger-pad normal forces
        (cols 12-13) and left gripper actuation force (col 16). This is NOT a six-axis
        wrench: it mixes three orthogonal force components of one sensor with three
        scalar contact/actuation magnitudes, and the wrist components are expressed
        in the flange frame, not the world frame. Right-arm channels are excluded
        because the audit measured them as constant, and left wrist torques because
        they barely discriminate contact.'
      history_encoder:
        force_dim: 6
        hidden_dim: 256
        hist_len: 16
        num_layers: 2
        num_heads: 4
        dropout: 0.0
      future_encoder:
        force_dim: 6
        hidden_dim: 256
        horizon: 32
        dropout: 0.0
      inject:
        action_hidden_dim: 1024
        force_hidden_dim: 256
        num_heads: 8
        dropout: 0.0
      force_head:
        action_hidden_dim: 1024
        force_dim: 6
        horizon: 32
        hidden_dim: 512
    norm_stats:
      file: /workspace/a3_data/a3_fw_force/force_calib_v1.json
lora:
  experts:
  - video_expert
  - action_expert
  target_modules:
  - q
  - k
  - v
  - o
  r: 16
  alpha: 32
  dropout: 0.0
default_action_infer_mode: one_pass_future_cache
